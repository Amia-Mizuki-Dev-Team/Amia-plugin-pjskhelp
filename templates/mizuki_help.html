<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --mizuki-pink: #e4a9cf;
            --mizuki-light: #fdf5f9;
            --niigo-dark: #2c2c2c;
            --text-main: #4a4a4a;
            --border-color: #f3cce2;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: var(--mizuki-light);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            width: 700px; 
        }

        .container {
            background: white;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(228, 169, 207, 0.25);
            padding: 35px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--mizuki-pink), var(--niigo-dark));
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--niigo-dark);
        }

        .header p {
            margin: 8px 0 0 0;
            color: var(--mizuki-pink);
            font-weight: 600;
            font-size: 14px;
        }

        .cmd-group { margin-bottom: 20px; }

        .cmd-title {
            background-color: var(--mizuki-pink);
            color: white;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .cmd-item {
            background: #fafafa;
            border-left: 4px solid var(--mizuki-pink);
            padding: 12px 18px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
        }

        .cmd-name {
            font-weight: bold;
            color: var(--niigo-dark);
            font-size: 15px;
            font-family: Consolas, monospace;
        }

        .cmd-desc {
            margin-top: 6px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 晓山瑞希 PJSK 帮助中心 🌸</h1>
            <p>— Mizuki Dev Team | HongXing(Jiangsu) Dev Team —</p>
        </div>
        
        <div class="cmd-group">
            <div class="cmd-title">{{ category_name }}</div>
            
            {% for cmd in commands %}
            <div class="cmd-item">
                <div class="cmd-name">{{ cmd.name }}</div>
                <div class="cmd-desc">{{ cmd.desc }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="footer">
            Generated by htmlrender | Mizuki Dev Team | HongXing(Jiangsu) Dev Team
        </div>
    </div>
</body>
</html>
